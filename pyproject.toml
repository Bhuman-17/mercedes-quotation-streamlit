[project]
name = "mercedes-quotation-streamlit"
version = "3.0.0"
description = "Mercedes-Benz India Proforma Quotation - Streamlit with custom quotation UI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.45,<2",
  "reportlab>=4.2.5,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
